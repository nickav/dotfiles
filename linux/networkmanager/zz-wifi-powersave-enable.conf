# Overrides Omarchy's default (omarchy-wifi-powersave.conf disables power
# save distro-wide, guarding against a firmware bug on Intel BE200/BE211).
# This machine's Wi-Fi is a MediaTek MT7925, unaffected by that bug, and the
# battery savings are worth the standard 802.11 power-save latency tradeoff.
# Filename sorts after "omarchy-" alphabetically so NetworkManager applies
# this value last.
[connection]
wifi.powersave = 3
